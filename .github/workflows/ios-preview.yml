name: Jagdlatein iOS – Entwicklungsbuild

# Isolated iOS development branch; the public website's main branch is untouched.
on:
  workflow_dispatch:
  push:
    branches: ['codex/ios-website-preview']

permissions:
  contents: read

concurrency:
  group: ios-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Projekt lesen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Swift testen und Simulator-App kompilieren
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        run: ./scripts/build-ios-preview.ps1
      - name: Prüfergebnis anzeigen
        run: Get-Content -LiteralPath mobile/ios-preview-result.json
