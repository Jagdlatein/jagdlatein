name: Jagdlatein iOS – TestFlight vorbereiten

# No push/PR trigger. Credentials are available only in the named environment
# and only to the explicitly selected signing/upload steps.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Check: Quellen prüfen; DeviceArchive: unsigniert; Export: signieren; Upload: an Apple senden'
        type: choice
        options: [Check, DeviceArchive, Export, Upload]
        default: Check
        required: true
      build_number:
        description: 'Neue Apple-Buildnummer für Export/Upload, z. B. 1 oder 2.1'
        type: string
        default: ''
        required: false
      website_environment:
        description: 'Production: öffentliche App; Sandbox: getrennte Test-App mit sichtbarem Testnamen'
        type: choice
        options: [Production, Sandbox]
        default: Production
        required: true

permissions:
  contents: read

concurrency:
  group: jagdlatein-testflight
  cancel-in-progress: false

jobs:
  checks:
    # Only our reviewed development branch or main may run this workflow.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/ios-website-preview'
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Projekt lesen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Quellen und TestFlight-Vorbereitung prüfen
        working-directory: mobile
        run: |
          npm ci --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Entwicklungswerkzeuge fehlen.' }
          npm run ios:assets
          if ($LASTEXITCODE -ne 0) { throw 'App-Symbol konnte nicht vorbereitet werden.' }
          & ../scripts/build-ios-testflight.ps1 -Step Check

  device_archive:
    needs: checks
    if: inputs.mode == 'DeviceArchive'
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Projekt lesen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Gerätearchiv ohne Signierung erzeugen
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
          IOS_WEBSITE_ENVIRONMENT: ${{ inputs.website_environment }}
        run: ./scripts/build-ios-testflight.ps1 -Step DeviceArchive

  signing:
    needs: checks
    if: inputs.mode == 'Export' || inputs.mode == 'Upload'
    environment: ios-testflight
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Projekt lesen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Werkzeuge und Originalsymbol vorbereiten
        working-directory: mobile
        run: |
          npm ci --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Entwicklungswerkzeuge fehlen.' }
          npm run ios:assets
          if ($LASTEXITCODE -ne 0) { throw 'App-Symbol konnte nicht vorbereitet werden.' }
      - name: Signiertes App-Archiv und IPA erzeugen
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_BUILD_NUMBER: ${{ inputs.build_number }}
          IOS_WEBSITE_ENVIRONMENT: ${{ inputs.website_environment }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: ./scripts/build-ios-testflight.ps1 -Step Export
      - name: IPA prüfen und ausdrücklich an Apple hochladen
        if: inputs.mode == 'Upload'
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_WEBSITE_ENVIRONMENT: ${{ inputs.website_environment }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: ./scripts/build-ios-testflight.ps1 -Step Upload
