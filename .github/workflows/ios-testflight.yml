name: Jagdlatein iOS – TestFlight vorbereiten

# No push/PR trigger. Credentials are available only in the named environment
# and only to the explicitly selected signing/upload steps.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Check: Quellen prüfen; DeviceArchive: unsigniert; Export: signieren; Upload: an Apple senden'
        type: choice
        options: [Check, DeviceArchive, Export, Upload]
        default: Check
        required: true
      build_number:
        description: 'Neue Apple-Buildnummer für Export/Upload, z. B. 1 oder 2.1'
        type: string
        default: ''
        required: false
      marketing_version:
        description: 'App-Version: 0.1.0 für bisherige Tests; 1.0.0 für die geprüfte erste Store-Version'
        type: string
        default: '0.1.0'
        required: true
      website_environment:
        description: 'Production: öffentliche App; Sandbox: getrennte Test-App mit sichtbarem Testnamen'
        type: choice
        options: [Production, Sandbox]
        default: Production
        required: true
      native_push:
        description: 'Apple-Mitteilungen ausdrücklich aktivieren: nur signierte Production-App mit Firebase-Datei und Production-Push-Profil'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: jagdlatein-testflight
  cancel-in-progress: false

jobs:
  checks:
    # Only our reviewed development branch or main may run this workflow.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/codex/ios-website-preview'
    runs-on: macos-15
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Projekt lesen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Gewünschte App-Version prüfen
        env:
          IOS_MARKETING_VERSION: ${{ inputs.marketing_version }}
          IOS_NATIVE_PUSH: ${{ inputs.native_push }}
          IOS_REQUEST_MODE: ${{ inputs.mode }}
          IOS_WEBSITE_ENVIRONMENT: ${{ inputs.website_environment }}
        run: |
          if ($env:IOS_MARKETING_VERSION -notmatch '\A[0-9]{1,4}\.[0-9]{1,2}\.[0-9]{1,2}\z') { throw 'App-Version muss eine Version wie 0.1.0 oder 1.0.0 enthalten.' }
          if ([bool]::Parse($env:IOS_NATIVE_PUSH) -and ($env:IOS_REQUEST_MODE -cnotin @('Export','Upload') -or $env:IOS_WEBSITE_ENVIRONMENT -cne 'Production')) { throw 'Apple-Mitteilungen benötigen einen ausdrücklich signierten Production-Export oder Upload.' }
      - name: Quellen und TestFlight-Vorbereitung prüfen
        working-directory: mobile
        env:
          JL_NATIVE_PUSH_ENABLED: ${{ inputs.native_push && 'YES' || 'NO' }}
        run: |
          npm ci --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Entwicklungswerkzeuge fehlen.' }
          npm run ios:assets
          if ($LASTEXITCODE -ne 0) { throw 'App-Symbol konnte nicht vorbereitet werden.' }
          & ../scripts/build-ios-testflight.ps1 -Step Check
      - name: Push-Freigabeschranken ohne Signierung prüfen
        run: ./scripts/tests/ios-testflight-push.test.ps1

  device_archive:
    needs: checks
    if: inputs.mode == 'DeviceArchive'
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Projekt lesen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Gerätearchiv ohne Signierung erzeugen
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
          IOS_MARKETING_VERSION: ${{ inputs.marketing_version }}
          IOS_WEBSITE_ENVIRONMENT: ${{ inputs.website_environment }}
        run: ./scripts/build-ios-testflight.ps1 -Step DeviceArchive

  signing:
    needs: checks
    if: inputs.mode == 'Export' || inputs.mode == 'Upload'
    environment: ios-testflight
    runs-on: macos-15
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Projekt lesen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Werkzeuge und Originalsymbol vorbereiten
        working-directory: mobile
        run: |
          npm ci --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'Entwicklungswerkzeuge fehlen.' }
          npm run ios:assets
          if ($LASTEXITCODE -ne 0) { throw 'App-Symbol konnte nicht vorbereitet werden.' }
      - name: Signiertes App-Archiv und IPA erzeugen
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_BUILD_NUMBER: ${{ inputs.build_number }}
          IOS_MARKETING_VERSION: ${{ inputs.marketing_version }}
          IOS_WEBSITE_ENVIRONMENT: ${{ inputs.website_environment }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          IOS_NATIVE_PUSH: ${{ inputs.native_push }}
        run: ./scripts/build-ios-testflight.ps1 -Step Export -NativePush:([bool]::Parse($env:IOS_NATIVE_PUSH))
      - name: IPA prüfen und ausdrücklich an Apple hochladen
        if: inputs.mode == 'Upload'
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          IOS_MARKETING_VERSION: ${{ inputs.marketing_version }}
          IOS_WEBSITE_ENVIRONMENT: ${{ inputs.website_environment }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          IOS_NATIVE_PUSH: ${{ inputs.native_push }}
        run: ./scripts/build-ios-testflight.ps1 -Step Upload -NativePush:([bool]::Parse($env:IOS_NATIVE_PUSH))
